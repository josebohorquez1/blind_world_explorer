<dialog id="app-dialog" class="border-0 rounded shadow">
    <div class="modal-header">
        <h2 id="app-dialog-title" class="modal-title fs-5"></h2>
    </div>

    <div class="modal-body">
        <p id="app-dialog-message"></p>
    </div>

    <div class="modal-footer">
        <button
            id="app-dialog-cancel"
            class="btn btn-secondary"
            type="button"
        >
            Cancel
        </button>

        <button
            id="app-dialog-ok"
            class="btn btn-primary"
            type="button"
        >
            OK
        </button>
    </div>
</dialog>
